<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Startup AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#0a0a0a;color:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden;}
::-webkit-scrollbar{display:none;}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:#0a0a0a;transition:transform .28s cubic-bezier(.4,0,.2,1);overflow:hidden;}
.screen.off{transform:translateX(100%);pointer-events:none;}
#home{overflow-y:auto;}
.home-header{padding:56px 20px 24px;border-bottom:1px solid #1a1a1a;}
.app-title-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.app-icon{width:44px;height:44px;background:#0e7c7b;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;}
.app-title{font-size:24px;font-weight:700;}
.app-title span{color:#0ed2d2;}
.home-sub{font-size:14px;color:#777;line-height:1.55;}
.home-body{padding:20px 20px 50px;}
.field-label{font-size:13px;color:#777;margin-bottom:8px;display:block;}
.field-input{width:100%;background:#141414;border:1px solid #222;border-radius:12px;padding:14px 16px;font-size:15px;color:#fff;outline:none;font-family:inherit;transition:border-color .2s;}
.field-input:focus{border-color:#0e7c7b;}
.field-input::placeholder{color:#3a3a3a;}
textarea.field-input{resize:none;line-height:1.5;margin-bottom:18px;}
input.field-input{margin-bottom:18px;}
.start-btn{width:100%;height:54px;border-radius:12px;border:none;background:#0e7c7b;color:#fff;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;}
.start-btn:disabled{background:#1a1a1a;color:#3a3a3a;cursor:not-allowed;}
.start-btn:active{opacity:.85;}
.divider{text-align:center;color:#333;font-size:13px;margin:22px 0;}
.example-list{display:flex;flex-direction:column;gap:10px;}
.ex-btn{background:#141414;border:1px solid #222;border-radius:12px;padding:14px 16px;color:#aaa;font-size:14px;font-family:inherit;text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;}
.ex-btn:active{border-color:#0e7c7b;color:#fff;}
.ex-ico{font-size:20px;flex-shrink:0;}

#app{display:flex;flex-direction:column;}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #1a1a1a;flex-shrink:0;}
.top-back{font-size:26px;color:#fff;cursor:pointer;}
.top-title{font-size:17px;font-weight:600;}
.top-prog{font-size:13px;color:#0ed2d2;}
.prog-bar{height:2px;background:#1a1a1a;flex-shrink:0;}
.prog-fill{height:100%;background:#0e7c7b;transition:width .3s;}
.report-scroll{flex:1;overflow-y:auto;padding-bottom:20px;}
.cat-block{padding:0 20px;}
.cat-title{font-size:12px;font-weight:700;color:#0ed2d2;letter-spacing:1px;padding:20px 0 10px;border-bottom:1px solid #1a1a1a;margin-bottom:2px;}
.rep-item{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid #161616;cursor:pointer;}
.rep-item:active{opacity:.6;}
.rep-ico{width:44px;height:44px;border-radius:50%;background:#141414;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.rep-item.done .rep-ico{background:#0a2e2e;}
.rep-info{flex:1;min-width:0;}
.rep-name{font-size:15px;color:#fff;font-weight:400;}
.rep-status{font-size:12px;color:#444;margin-top:3px;}
.rep-item.done .rep-status{color:#0e7c7b;}
.rep-arr{font-size:20px;color:#2a2a2a;flex-shrink:0;}
.rep-item.done .rep-arr{color:#0e7c7b;}

#result{display:flex;flex-direction:column;}
.res-header{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid #1a1a1a;flex-shrink:0;}
.res-back{font-size:26px;color:#fff;cursor:pointer;flex-shrink:0;}
.res-title-wrap{flex:1;min-width:0;}
.res-title{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.res-sub{font-size:12px;color:#444;margin-top:2px;}
.redo-btn{height:34px;padding:0 14px;border-radius:8px;border:1px solid #222;background:transparent;color:#777;font-size:13px;cursor:pointer;font-family:inherit;flex-shrink:0;}
.redo-btn:active{border-color:#0e7c7b;color:#0ed2d2;}
.res-body{flex:1;overflow-y:auto;padding:20px 20px 50px;}

.res-tag{background:#111;border:1px solid #1a1a1a;border-radius:12px;padding:14px 16px;margin-bottom:22px;display:flex;align-items:center;gap:12px;}
.res-tag-ico{font-size:24px;}
.res-tag-name{font-size:14px;font-weight:600;color:#fff;}
.res-tag-biz{font-size:12px;color:#444;margin-top:2px;}

.c-h{font-size:15px;font-weight:600;color:#fff;margin:22px 0 8px;padding-left:12px;border-left:2px solid #0e7c7b;line-height:1.4;}
.c-p{font-size:15px;line-height:1.75;color:#aaa;}
.c-b{font-size:15px;line-height:1.75;padding-left:16px;color:#aaa;}
.c-bold{color:#ddd;font-weight:600;}
.c-code{background:#141414;padding:2px 7px;border-radius:4px;font-size:13px;color:#0ed2d2;font-family:monospace;}

.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;gap:18px;}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:38px;height:38px;border:3px solid #1a1a1a;border-top-color:#0e7c7b;border-radius:50%;animation:spin 1s linear infinite;}
.load-title{font-size:15px;font-weight:600;color:#fff;}
.load-sub{font-size:13px;color:#444;text-align:center;line-height:1.5;}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;align-items:flex-end;transition:opacity .2s;}
.overlay.off{opacity:0;pointer-events:none;}
.modal{background:#111;border-radius:20px 20px 0 0;border-top:1px solid #1a1a1a;padding:20px 20px 40px;width:100%;}
.modal-handle{width:36px;height:4px;background:#2a2a2a;border-radius:2px;margin:0 auto 20px;}
.modal-title{font-size:17px;font-weight:700;margin-bottom:18px;}
.modal-save{width:100%;height:50px;border-radius:12px;border:none;background:#0e7c7b;color:#fff;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;}

.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(10px);background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:10px 18px;font-size:13px;color:#fff;z-index:400;opacity:0;transition:all .22s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.ok{border-color:#0e7c7b;color:#0ed2d2;}
.toast.err{border-color:#7c2020;color:#f87171;}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.fi{animation:fi .2s ease both;}
</style>
</head>
<body>

<!-- HOME -->
<div class="screen" id="home">
  <div class="home-header">
    <div class="app-title-row">
      <div class="app-icon">⚡</div>
      <div class="app-title">Startup <span>AI</span></div>
    </div>
    <div class="home-sub">Enter your business name and idea to generate 38 detailed AI reports — free, no signup required.</div>
  </div>
  <div class="home-body">
    <label class="field-label">Business Name</label>
    <input class="field-input" type="text" id="biz-name" placeholder="E.g., FitBuddy, TaskFlow, QuickHire"/>

    <label class="field-label">Business Idea</label>
    <textarea class="field-input" id="biz-desc" rows="5" placeholder="Describe your startup — what it does, who it's for, and what problem it solves. More detail = better reports."></textarea>

    <button class="start-btn" id="start-btn" onclick="startApp()" disabled>Enter your name and idea to continue</button>

    <div class="divider">— or try an example —</div>

    <div class="example-list">
      <button class="ex-btn" onclick="setEx('FitBuddy','AI-powered personalized fitness coach app for Indians doing home workouts. Creates custom workout plans, tracks progress, and motivates users through gamification. Targets working professionals aged 25-40.')">
        <span class="ex-ico">🏋️</span><span>AI Fitness Coach App</span>
      </button>
      <button class="ex-btn" onclick="setEx('FreelanceHub','AI platform for Indian freelancers to find clients, manage projects, generate invoices, and get paid. Targeting 15M+ freelancers across design, development, and writing.')">
        <span class="ex-ico">💼</span><span>Freelancer Platform</span>
      </button>
      <button class="ex-btn" onclick="setEx('RestroOps','B2B inventory and order management SaaS for small restaurants and cloud kitchens in India. Reduces food waste by 40% and automates reordering with Zomato and Swiggy integration.')">
        <span class="ex-ico">🍽️</span><span>Restaurant B2B SaaS</span>
      </button>
      <button class="ex-btn" onclick="setEx('LearnPath','AI adaptive learning platform for Indian students preparing for JEE, NEET, and UPSC. Personalized study plans, AI doubt solving, and mock tests targeting tier 2 and 3 city students.')">
        <span class="ex-ico">📚</span><span>EdTech Platform</span>
      </button>
    </div>
  </div>
</div>

<!-- REPORT LIST -->
<div class="screen off" id="app">
  <div class="top-bar">
    <div class="top-back" onclick="showScreen('home')">←</div>
    <div class="top-title">Select Report</div>
    <div class="top-prog" id="prog-cnt">0 / 38</div>
  </div>
  <div class="prog-bar"><div class="prog-fill" id="prog-fill"></div></div>
  <div class="report-scroll" id="report-scroll"></div>
</div>

<!-- RESULT -->
<div class="screen off" id="result">
  <div class="res-header">
    <div class="res-back" onclick="goBack()">←</div>
    <div class="res-title-wrap">
      <div class="res-title" id="r-title">Report</div>
      <div class="res-sub" id="r-biz">Business</div>
    </div>
    <button class="redo-btn" id="redo-btn" onclick="redoCurrent()" style="display:none">↻ Redo</button>
  </div>
  <div class="res-body" id="res-body"></div>
</div>

<!-- SETTINGS MODAL -->
<div class="overlay off" id="modal" onclick="modalBg(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Settings</div>
    <label class="field-label">Business Name</label>
    <input class="field-input" type="text" id="m-name" style="margin-bottom:16px"/>
    <label class="field-label">Business Idea</label>
    <textarea class="field-input" id="m-desc" rows="4" style="margin-bottom:8px"></textarea>
    <div style="font-size:12px;color:#7c3030;margin-bottom:12px;">⚠ Changing your idea will clear all generated reports</div>
    <button class="modal-save" onclick="saveModal()">Save Changes</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SECTIONS = [
  {id:'overview',label:'Business Overview',icon:'📋',cat:'IDEA & VISION'},
  {id:'problem',label:'Problem & Solution',icon:'💡',cat:'IDEA & VISION'},
  {id:'whynow',label:'Why Now?',icon:'⏰',cat:'IDEA & VISION'},
  {id:'vision',label:'Vision & Mission',icon:'🎯',cat:'IDEA & VISION'},
  {id:'market',label:'Market Potential',icon:'📊',cat:'MARKET RESEARCH'},
  {id:'segments',label:'Customer Segmentation',icon:'👥',cat:'MARKET RESEARCH'},
  {id:'painpoints',label:'User Pain Points',icon:'⚠️',cat:'MARKET RESEARCH'},
  {id:'trends',label:'Market & Consumer Trends',icon:'📈',cat:'MARKET RESEARCH'},
  {id:'competition',label:'Competition & Alternatives',icon:'⚔️',cat:'MARKET RESEARCH'},
  {id:'stories',label:'User Stories',icon:'📖',cat:'PRODUCT & MVP'},
  {id:'mvp',label:'Minimum Viable Product',icon:'🚀',cat:'PRODUCT & MVP'},
  {id:'roadmap',label:'Product Roadmap',icon:'🗺️',cat:'PRODUCT & MVP'},
  {id:'moscow',label:'Feature Prioritization (MoSCoW)',icon:'✅',cat:'PRODUCT & MVP'},
  {id:'ai',label:'AI & Automation Opportunities',icon:'🤖',cat:'PRODUCT & MVP'},
  {id:'techstack',label:'Tech Stack & Tools',icon:'⚙️',cat:'PRODUCT & MVP'},
  {id:'design',label:'Design & Mockup Guide',icon:'🎨',cat:'PRODUCT & MVP'},
  {id:'bizmodel',label:'Business Model & Monetization',icon:'💰',cat:'BUSINESS MODEL'},
  {id:'revenue',label:'Revenue Forecast',icon:'📉',cat:'BUSINESS MODEL'},
  {id:'gtm',label:'Go-to-Market Strategy',icon:'📣',cat:'BUSINESS MODEL'},
  {id:'distribution',label:'Distribution Channels',icon:'🚚',cat:'BUSINESS MODEL'},
  {id:'acquisition',label:'User Acquisition & Retention',icon:'🔄',cat:'BUSINESS MODEL'},
  {id:'journey',label:'Customer Journey Map',icon:'🗺️',cat:'BUSINESS MODEL'},
  {id:'marketing',label:'Marketing & Promotion',icon:'📢',cat:'BUSINESS MODEL'},
  {id:'seo',label:'SEO & Ad Campaigns',icon:'🔍',cat:'BUSINESS MODEL'},
  {id:'team',label:'Team Structure & Hiring',icon:'👤',cat:'TEAM & OPERATIONS'},
  {id:'costs',label:'Operational Costs',icon:'💸',cat:'TEAM & OPERATIONS'},
  {id:'kpis',label:'Key Performance Indicators',icon:'📊',cat:'TEAM & OPERATIONS'},
  {id:'support',label:'Support & Customer Success',icon:'🎧',cat:'TEAM & OPERATIONS'},
  {id:'legal',label:'Legal & Compliance',icon:'⚖️',cat:'TEAM & OPERATIONS'},
  {id:'traction',label:'Traction & Metrics',icon:'📈',cat:'FUNDING & GROWTH'},
  {id:'valuation',label:'Business Valuation',icon:'💎',cat:'FUNDING & GROWTH'},
  {id:'funding',label:'Seed / Pre-seed Funding',icon:'💵',cat:'FUNDING & GROWTH'},
  {id:'investors',label:'Finding Investors',icon:'🔎',cat:'FUNDING & GROWTH'},
  {id:'pitch',label:'Investor Pitch Outline',icon:'🎤',cat:'FUNDING & GROWTH'},
  {id:'exit',label:'Exit Strategy',icon:'🚪',cat:'FUNDING & GROWTH'},
  {id:'naming',label:'Name & Tagline Ideas',icon:'✏️',cat:'BRAND & PARTNERSHIPS'},
  {id:'partnerships',label:'Partnerships & Collaborations',icon:'🤝',cat:'BRAND & PARTNERSHIPS'},
  {id:'brand',label:'Brand Positioning',icon:'🎯',cat:'BRAND & PARTNERSHIPS'},
];
const CATS = [...new Set(SECTIONS.map(s=>s.cat))];
let BIZ={name:'',desc:''}, CONTENT={}, activeSection=null, isLoading=false;

function getPrompt(id,name,desc){
  const base=`You are a senior startup consultant with 20 years of experience. Write a detailed, realistic, specific report for startup "${name}": ${desc}.\n\nRules:\n- Use REAL data, real market numbers, real competitor names and tools\n- Be SPECIFIC to this exact business — no generic advice\n- India market focus where applicable\n- Use ### for section headers\n- Use ** for bold key terms\n- Use - for bullet points\n- Write in clear professional English only\n- Be comprehensive and actionable\n\n`;
  const p={
    overview:base+`Write a complete Business Overview:\n### Executive Summary\n### Core Value Proposition\n### Business Model Type\n### Target Market\n### Capital Required for MVP (INR)\n### Key Success Factors`,
    problem:base+`Write Problem & Solution analysis:\n### The Core Problem (with real statistics)\n### Who Is Affected\n### Current Inadequate Solutions (3 real alternatives + flaws)\n### Our Solution\n### Top 3 Differentiators\n### Why Users Will Switch`,
    whynow:base+`Write Why Now analysis:\n### Market Timing\n### Technology Enablers\n### Post-2020 Behavioral Shifts\n### Regulatory Tailwinds\n### Economic Factors\n### Window of Opportunity`,
    vision:base+`Write Vision & Mission:\n### 10-Year Vision Statement\n### Mission Statement\n### Core Values (5)\n### Strategic Pillars (3)\n### North Star Metric\n### Social Impact`,
    market:base+`Write Market Potential:\n### TAM - Total Addressable Market (INR + USD)\n### SAM - Serviceable Addressable Market\n### SOM - Year 1 and Year 3 Targets\n### Market CAGR\n### Key Growth Drivers (5)\n### India Tier 1/2/3 Breakdown\n### Market Risks`,
    segments:base+`Write Customer Segmentation with 3 personas:\n### Persona 1: [Name]\n- Age, job, city tier, monthly income\n- Top 3 pain points\n- Current tools they use\n- Willingness to pay per month (INR)\n- Where they spend time online\n\n### Persona 2: [Name]\n[Same format]\n\n### Persona 3: [Name]\n[Same format]\n\n### Primary Target & Why`,
    painpoints:base+`Write User Pain Points:\n### Pain Point 1: [Name] — Severity 9/10\n- Time lost per week\n- Money wasted per month (INR)\n- Current workaround and why it fails\n\n[5 pain points total]\n\n### Jobs-to-be-Done (3)\n### Emotional Pain`,
    trends:base+`Write Market & Consumer Trends:\n### Macro Trends (5 with real data)\n### Micro Trends (3)\n### India-Specific Dynamics\n### Consumer Behavior Shifts 2023-2025\n### 2026 Predictions`,
    competition:base+`Write Competition & Alternatives:\n### Competitor 1: [Real Company]\n- Funding, users, pricing, strengths, weaknesses\n\n[3-4 real competitors]\n\n### Competitive Matrix\n### Our 3 Unfair Advantages\n### Blue Ocean Opportunity`,
    stories:base+`Write 10 User Stories across 3 epics:\n### Epic 1: [Name]\n**Story 1:** As a [persona], I want [feature] so that [benefit]\n- Acceptance Criteria (3 points)\n- Priority: High | Story Points: X\n\n[10 stories total]\n\n### Definition of Done`,
    mvp:base+`Write MVP Definition:\n### Core MVP Features (7)\n### Excluded from v1 (5 + reasons)\n### MVP Success Metrics (5 numbers)\n### Build Timeline (8 weeks)\n### Cost Estimate (INR)\n### Validation Method`,
    roadmap:base+`Write 12-Month Product Roadmap:\n### Phase 1: MVP (Month 1-3) — Features, Team, Budget, KPIs\n### Phase 2: Growth (Month 4-6)\n### Phase 3: Scale (Month 7-9)\n### Phase 4: Expand (Month 10-12)\n### Year 2 Vision`,
    moscow:base+`Write MoSCoW Prioritization:\n### MUST HAVE (8 features with Effort and Impact score)\n### SHOULD HAVE (6 features)\n### COULD HAVE (5 features)\n### WON'T HAVE NOW (4 features + reason)\n### Total Effort Summary`,
    ai:base+`Write AI & Automation Opportunities:\n### AI Feature 1-5 (technology, functionality, value, complexity)\n### Process Automations (4 with time and cost saved)\n### AI APIs to Integrate (real, with INR cost)\n### Competitive Moat from AI`,
    techstack:base+`Write Tech Stack Recommendations:\n### Each Layer: Frontend, Backend, Database, Auth, Payments, Cloud, Analytics, CI/CD\nFor each: specific technology, monthly cost in INR, reason chosen\n\n### Total Monthly Cost at scale\n### Build vs Buy Decisions (5)\n### Required Skills`,
    design:base+`Write Design & UX Guide:\n### Design Philosophy\n### Color Palette (hex codes)\n### Typography\n### 5 Key Screens to Design\n### UX Principles (4)\n### Accessibility Standards\n### Design Timeline`,
    bizmodel:base+`Write Business Model & Monetization:\n### Primary Revenue Model\n### Pricing Tiers (Free, Tier 1, Tier 2, Tier 3 with INR prices)\n### Unit Economics (CAC, LTV, LTV:CAC, Payback period)\n### Path to 1 Crore ARR`,
    revenue:base+`Write Revenue Forecast:\n### Assumptions\n### Year 1 Monthly (Month 1-12: Users, Paying%, MRR in INR)\n### Year 2-3 Quarterly\n### Break-Even Analysis\n### Best/Base/Worst Case Scenarios\n### Key Revenue Levers`,
    gtm:base+`Write Go-to-Market Strategy:\n### GTM Motion\n### First 100 Customers Plan (Week 1-2, 3-4, 5-8, 9-12)\n### Channel Strategy (3 channels with budget% and CAC)\n### Launch Messaging\n### PR Strategy\n### 90-Day KPIs`,
    distribution:base+`Write Distribution Channels:\n### 5 Channels (each: CAC, volume, tactics, time to scale)\n### App Store Strategy\n### B2B Distribution\n### Integration-based Distribution`,
    acquisition:base+`Write User Acquisition & Retention:\n### 5 Acquisition Channels (CAC in INR each)\n### 7-Step Onboarding Flow\n### Activation Metric\n### Retention Targets (D1/D7/D30)\n### 5 Retention Mechanisms\n### Churn Intervention\n### Referral Program`,
    journey:base+`Write Customer Journey Map for each stage:\nAwareness → Interest → Consideration → Decision → Onboarding → Value → Loyalty → Advocacy\nEach stage: User action, Emotion, Touchpoint, Our opportunity, Success metric`,
    marketing:base+`Write Marketing & Promotion Plan:\n### Brand Voice\n### Content Marketing Strategy\n### Social Media Plan (Instagram, LinkedIn, Twitter)\n### Influencer Strategy\n### Email Marketing Sequences\n### 6-Month Content Calendar`,
    seo:base+`Write SEO & Ad Campaigns:\n### Target Keywords (10 with search volume)\n### SEO Content Plan (5 pillar articles)\n### Google Ads (budget INR, keywords, CPC, conversions)\n### Meta Ads (budget, audiences, creative)\n### 6-Month Traffic Goal\n### Conversion Rate Targets`,
    team:base+`Write Team Structure & Hiring:\n### Ideal Founding Team (2-3 profiles)\n### First 5 Hires (role, month, salary INR, skills needed)\n### Equity Distribution\n### 12-Month Org Chart\n### Culture Principles (5)\n### Remote vs Hybrid Decision`,
    costs:base+`Write Operational Costs:\n### Month 1-2, 3-4, 5-6 breakdown (Technology, Salaries, Marketing, Legal, Total Burn)\n### 6-Month Total Runway Needed (INR)\n### 5 Cost Optimization Strategies\n### What to Cut First`,
    kpis:base+`Write KPIs Framework:\n### North Star Metric\n### Business KPIs (5)\n### Product KPIs (5)\n### Financial KPIs (3)\n### Team KPIs (3)\n### Red Flag Thresholds`,
    support:base+`Write Support & Customer Success Plan:\n### Channels & SLAs\n### Top 8 FAQs with Answers\n### Escalation Matrix\n### Customer Health Score signals\n### CS Playbook\n### Tools Stack (INR costs)`,
    legal:base+`Write Legal & Compliance for India:\n### Business Structure recommendation\n### Registration Process & Cost\n### Required Licenses\n### Data Privacy (IT Act + GDPR)\n### IP Protection\n### GST\n### Top 3 Legal Risks\n### Year 1 Legal Budget`,
    traction:base+`Write Traction & Metrics:\n### 30/60/90-Day Milestones (specific numbers)\n### Top 5 Traction Channels\n### Investor Traction Metrics\n### Early Adopter Strategy\n### Proof of Concept Plan`,
    valuation:base+`Write Business Valuation:\n### Method 1: Revenue Multiple\n### Method 2: Comparable Indian Startups (real examples)\n### Method 3: Scorecard\n### Current Valuation Range (INR)\n### Post-MVP Target\n### Post-Seed Target\n### 5 Key Value Drivers`,
    funding:base+`Write Seed Funding Strategy:\n### How Much to Raise (INR/USD)\n### Use of Funds Breakdown\n### Dilution Strategy\n### Pre-Money Valuation Ask\n### 5 Milestones Before Raising\n### 12-Week Fundraising Timeline`,
    investors:base+`Write Finding Investors Guide for India:\n### Top 5 Indian VCs (focus, ticket size, portfolio, how to reach)\n### 5 Angel Investors or Communities\n### Accelerators to Apply\n### Warm Intro Strategy\n### Cold Outreach Email Template`,
    pitch:base+`Write Investor Pitch (10 slides):\nEach slide: Key message, Data point, Visual suggestion\n\n### Story Arc\n### Top 5 Investor Objections & Rebuttals\n### The Ask Slide`,
    exit:base+`Write Exit Strategy:\n### 5 Potential Acquirers (real companies, rationale, estimated price)\n### IPO Feasibility\n### 7-Year Exit Path\n### Factors That Maximize Exit Value`,
    naming:base+`Write Name & Tagline Ideas:\n### 10 Name Options (rationale, domain likelihood)\n### 5 Taglines\n### Brand Voice\n### Logo Concept\n### Name Testing Methods\n### Trademark Process India`,
    partnerships:base+`Write Partnerships & Collaborations:\n### 6 Partners (real companies, type, value exchange, approach, impact, timeline)\n### Prioritization\n### Key Terms to Negotiate`,
    brand:base+`Write Brand Positioning:\n### Positioning Statement\n### Brand Archetype\n### Perceptual Map\n### Messaging Hierarchy\n### Brand Promise\n### Tone of Voice\n### How to Own a Category in India`,
  };
  return p[id]||base+`Write a comprehensive ${id} analysis.`;
}

window.onload=()=>{
  document.getElementById('biz-name').addEventListener('input',checkForm);
  document.getElementById('biz-desc').addEventListener('input',checkForm);
};

function checkForm(){
  const n=document.getElementById('biz-name').value.trim();
  const d=document.getElementById('biz-desc').value.trim();
  const btn=document.getElementById('start-btn');
  btn.disabled=!(n&&d);
  btn.textContent=(n&&d)?'Select Report →':'Enter your name and idea to continue';
}

function setEx(name,desc){
  document.getElementById('biz-name').value=name;
  document.getElementById('biz-desc').value=desc;
  checkForm();
}

function startApp(){
  const n=document.getElementById('biz-name').value.trim();
  const d=document.getElementById('biz-desc').value.trim();
  if(!n||!d)return;
  BIZ={name:n,desc:d};
  CONTENT={};
  buildList();
  showScreen('app');
}

function buildList(){
  const scroll=document.getElementById('report-scroll');
  scroll.innerHTML='';
  CATS.forEach(cat=>{
    const secs=SECTIONS.filter(s=>s.cat===cat);
    const block=document.createElement('div');
    block.className='cat-block';
    const title=document.createElement('div');
    title.className='cat-title';
    title.textContent=`${cat} (${secs.length})`;
    block.appendChild(title);
    secs.forEach(s=>{
      const item=document.createElement('div');
      item.className='rep-item'+(CONTENT[s.id]?' done':'');
      item.onclick=()=>openSection(s);
      item.innerHTML=`<div class="rep-ico">${s.icon}</div><div class="rep-info"><div class="rep-name">${s.label}</div><div class="rep-status">${CONTENT[s.id]?'Generated — tap to view':'Tap to generate'}</div></div><div class="rep-arr">${CONTENT[s.id]?'✓':'›'}</div>`;
      block.appendChild(item);
    });
    scroll.appendChild(block);
  });
  updateProg();
}

function updateProg(){
  const done=Object.keys(CONTENT).length;
  document.getElementById('prog-fill').style.width=(done/38*100)+'%';
  document.getElementById('prog-cnt').textContent=done+' / 38';
}

function openSection(s){
  activeSection=s;
  document.getElementById('r-title').textContent=s.label;
  document.getElementById('r-biz').textContent=BIZ.name;
  showScreen('result');
  if(CONTENT[s.id]){renderContent();}else{generate(s);}
}

function renderContent(){
  const body=document.getElementById('res-body');
  const redo=document.getElementById('redo-btn');
  if(isLoading){
    redo.style.display='none';
    body.innerHTML=`<div class="loading-wrap"><div class="spinner"></div><div class="load-title">Generating report...</div><div class="load-sub">${activeSection.label}<br>for ${BIZ.name}</div></div>`;
  }else if(CONTENT[activeSection.id]){
    redo.style.display='block';
    body.innerHTML=`<div class="res-tag fi"><div class="res-tag-ico">${activeSection.icon}</div><div><div class="res-tag-name">${activeSection.label}</div><div class="res-tag-biz">for ${BIZ.name}</div></div></div><div class="fi">${fmt(CONTENT[activeSection.id])}</div>`;
  }
}

function fmt(t){
  return t
    .replace(/###\s*(.+?)(?:\n|$)/g,'<div class="c-h">$1</div>')
    .replace(/##\s*(.+?)(?:\n|$)/g,'<div class="c-h">$1</div>')
    .replace(/# (.+?)(?:\n|$)/g,'<div class="c-h">$1</div>')
    .replace(/\*\*(.+?)\*\*/g,'<span class="c-bold">$1</span>')
    .replace(/`([^`\n]+)`/g,'<code class="c-code">$1</code>')
    .replace(/^[-•]\s(.+)$/gm,'<div class="c-b">• $1</div>')
    .replace(/^\d+\.\s(.+)$/gm,m=>`<div class="c-b">${m.trim()}</div>`)
    .replace(/\n\n/g,'<div style="height:8px"></div>')
    .replace(/\n/g,'<br>');
}

async function generate(section){
  isLoading=true;
  renderContent();
  try{
    const prompt=getPrompt(section.id,BIZ.name,BIZ.desc);
    const sys='You are a senior startup consultant. Respond in English only. Use ### for headers, ** for bold, - for bullets. Provide detailed realistic data with real numbers and real company names.';
    const url=`https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=openai&system=${encodeURIComponent(sys)}&seed=${Math.floor(Math.random()*99999)}`;
    const resp=await fetch(url);
    if(!resp.ok)throw new Error('Server error '+resp.status);
    const text=await resp.text();
    if(!text||text.length<80)throw new Error('Empty response — tap Redo');
    CONTENT[section.id]=text;
    isLoading=false;
    renderContent();
    buildList();
    showToast('Report generated!','ok');
  }catch(e){
    isLoading=false;
    CONTENT[section.id]='❌ '+e.message+'\n\nTap Redo to try again.';
    renderContent();
    showToast('Error — tap Redo','err');
  }
}

async function redoCurrent(){
  if(!activeSection||isLoading)return;
  delete CONTENT[activeSection.id];
  buildList();
  await generate(activeSection);
}

function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('off',s.id!==id));}
function goBack(){showScreen('app');buildList();}
function openModal(){document.getElementById('m-name').value=BIZ.name;document.getElementById('m-desc').value=BIZ.desc;document.getElementById('modal').classList.remove('off');}
function modalBg(e){if(e.target.id==='modal')document.getElementById('modal').classList.add('off');}
function saveModal(){
  const n=document.getElementById('m-name').value.trim();
  const d=document.getElementById('m-desc').value.trim();
  if(!n||!d)return;
  if(n!==BIZ.name||d!==BIZ.desc)CONTENT={};
  BIZ={name:n,desc:d};
  document.getElementById('modal').classList.add('off');
  buildList();
  showToast('Saved!','ok');
}
function showToast(msg,type='ok'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className=`toast show ${type}`;
  setTimeout(()=>t.classList.remove('show'),3000);
}
</script>
</body>
</html>
