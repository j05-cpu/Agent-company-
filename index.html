<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Digital Godfather — AI Agent Dashboard</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Syne:wght@600;700;800;900&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />

<!-- React + ReactDOM (production) -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<!-- Babel (JSX transform in-browser) -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Framer Motion -->
<script src="https://unpkg.com/framer-motion@11/dist/framer-motion.js"></script>

<style>
  /* ── RESET & ROOT ──────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; overflow: hidden; }

  :root {
    --bg-void:    #03040c;
    --bg-deep:    #05070f;
    --bg-panel:   rgba(8,10,20,0.9);
    --bg-glass:   rgba(10,12,24,0.85);
    --bg-card:    rgba(12,14,28,0.7);
    --bg-hover:   rgba(255,255,255,0.03);
    --border:     rgba(255,255,255,0.06);
    --border-hi:  rgba(255,255,255,0.1);

    --cyan:       #22d3ee;
    --cyan-dim:   rgba(34,211,238,0.12);
    --cyan-glow:  rgba(34,211,238,0.25);
    --gold:       #f59e0b;
    --gold-dim:   rgba(245,158,11,0.12);
    --violet:     #a78bfa;
    --violet-dim: rgba(167,139,250,0.12);
    --green:      #22c55e;
    --red:        #f43f5e;

    --txt-primary: #f1f5f9;
    --txt-mid:     #64748b;
    --txt-dim:     #334155;
    --txt-ghost:   #1e293b;

    --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
    --font-display: 'Syne', sans-serif;
    --font-body: 'Space Grotesk', sans-serif;
  }

  body {
    background: var(--bg-void);
    color: var(--txt-primary);
    font-family: var(--font-mono);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ── SCROLLBARS ────────────────────────────────────────────────── */
  ::-webkit-scrollbar { width: 3px; height: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(34,211,238,0.2); border-radius: 2px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(34,211,238,0.4); }

  /* ── INPUT / TEXTAREA ──────────────────────────────────────────── */
  input, textarea, button, select { font-family: inherit; }
  input::placeholder, textarea::placeholder { color: var(--txt-ghost); }
  textarea { resize: none; }

  /* ── ANIMATIONS ────────────────────────────────────────────────── */
  @keyframes ping {
    75%, 100% { transform: scale(2.2); opacity: 0; }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  @keyframes scanline {
    0%   { transform: translateY(-100%); }
    100% { transform: translateY(100vh); }
  }
  @keyframes grid-pulse {
    0%, 100% { opacity: 0.015; }
    50%       { opacity: 0.03; }
  }
  @keyframes neon-breathe {
    0%, 100% { box-shadow: 0 0 8px rgba(34,211,238,0.2),  0 0 20px rgba(34,211,238,0.08); }
    50%       { box-shadow: 0 0 14px rgba(34,211,238,0.35), 0 0 40px rgba(34,211,238,0.15); }
  }
  @keyframes cursor-blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0; }
  }
  @keyframes shimmer-sweep {
    0%   { background-position: -200% center; }
    100% { background-position:  200% center; }
  }
  @keyframes status-slide-in {
    from { transform: translateX(100%); opacity: 0; }
    to   { transform: translateX(0);    opacity: 1; }
  }
  @keyframes fadeup {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .spin    { animation: spin 1s linear infinite; }
  .fadeup  { animation: fadeup 0.25s ease both; }

  /* ── GLASS PANEL ───────────────────────────────────────────────── */
  .glass {
    background: var(--bg-glass);
    border: 1px solid var(--border);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 8px;
  }

  /* ── NEON BORDER ───────────────────────────────────────────────── */
  .neon-border {
    border: 1px solid rgba(34,211,238,0.25) !important;
    animation: neon-breathe 3s ease-in-out infinite;
  }

  /* ── SYNTAX HIGHLIGHT ──────────────────────────────────────────── */
  .sh-tag    { color: #22d3ee; }
  .sh-attr   { color: #a78bfa; }
  .sh-val    { color: #22c55e; }
  .sh-kw     { color: #f59e0b; }
  .sh-str    { color: #22c55e; }
  .sh-cmt    { color: #334155; }
  .sh-num    { color: #fb923c; }

  /* ── RESPONSIVE (Mobile) ───────────────────────────────────────── */
  @media (max-width: 768px) {
    .sidebar-desktop { display: none !important; }
    .canvas-panel { display: none !important; }
    .drag-handle  { display: none !important; }
    .main-center  { flex: 1 !important; }
  }
</style>
</head>

/* ── UTILITIES ──────────────────────────────────────────────────────────────── */
function copyText(text) {
  navigator.clipboard?.writeText(text).catch(() => {
    const t = document.createElement("textarea");
    t.value = text; document.body.appendChild(t); t.select();
    document.execCommand("copy"); document.body.removeChild(t);
  });
}

function syntaxHighlight(code = "") {
  return code
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    // HTML tags
    .replace(/(&lt;\/?[a-zA-Z][^&\n]*?&gt;)/g, '<span class="sh-tag">$1</span>')
    // CSS properties
    .replace(/([\w-]+)(\s*:(?!:))/g, '<span class="sh-attr">$1</span>$2')
    // JS keywords
    .replace(/\b(const|let|var|function|return|if|else|for|while|class|import|export|from|async|await|new|this|typeof|null|undefined|true|false)\b/g, '<span class="sh-kw">$1</span>')
    // Strings
    .replace(/(["'`][^"'`\n]*["'`])/g, '<span class="sh-str">$1</span>')
    // Single-line comments
    .replace(/(\/\/[^\n]*)/g, '<span class="sh-cmt">$1</span>')
    // Numbers
    .replace(/\b(\d+\.?\d*)/g, '<span class="sh-num">$1</span>');
}

/* ── PULSE DOT ──────────────────────────────────────────────────────────────── */
function PulseDot({ color = "#22d3ee", size = 8, active = true }) {
  return (
    <span style={{ position:"relative", display:"inline-flex", width:size, height:size, flexShrink:0 }}>
      {active && (
        <span style={{
          position:"absolute", inset:0, borderRadius:"50%",
          background: color, opacity:0.5,
          animation: "ping 1.8s cubic-bezier(0,0,.2,1) infinite",
        }} />
      )}
      <span style={{
        position:"relative", display:"inline-flex", borderRadius:"50%",
        width:size, height:size,
        background: active ? color : "#1e293b",
        boxShadow: active ? `0 0 6px ${color}` : "none",
        transition: "all .4s",
      }} />
    </span>
  );
}

/* ── AGENT CARD (Sidebar) ───────────────────────────────────────────────────── */
function AgentCard({ agent, status="idle", thought="" }) {
  const isActive = status === "active";
  const isDone   = status === "done";

  return (
    <div style={{
      background: isActive ? agent.bg : "rgba(8,10,20,0.6)",
      border: `1px solid ${isActive ? agent.border : "rgba(255,255,255,0.05)"}`,
      borderRadius: 8, padding: "10px 12px", position:"relative", overflow:"hidden",
      transition: "all .35s",
      boxShadow: isActive ? `0 0 18px ${agent.color}18` : "none",
    }}>
      {/* Shimmer sweep on active */}
      {isActive && (
        <div style={{
          position:"absolute", inset:0, pointerEvents:"none",
          background: `linear-gradient(90deg, transparent 0%, ${agent.color}10 50%, transparent 100%)`,
          backgroundSize: "200% 100%",
          animation: "shimmer-sweep 2.5s linear infinite",
        }} />
      )}

      <div style={{ display:"flex", alignItems:"center", gap:8, position:"relative" }}>
        <div style={{
          width:30, height:30, borderRadius:6,
          background: agent.bg, border:`1px solid ${agent.border}`,
          display:"flex", alignItems:"center", justifyContent:"center",
          filter: (!isActive && !isDone) ? "grayscale(0.9) opacity(0.4)" : "none",
          transition: "filter .3s",
        }}>
          {I(agent.icon, 14, agent.color)}
        </div>
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ display:"flex", alignItems:"center", gap:5, marginBottom:2 }}>
            <span style={{ fontSize:10.5, fontWeight:600, color: isActive ? "#f1f5f9" : "#475569", letterSpacing:"0.01em" }}>
              {agent.label}
            </span>
            <PulseDot color={agent.color} size={5} active={isActive} />
          </div>
          <div style={{ fontSize:8.5, color: isActive ? agent.color : "#334155", letterSpacing:"0.08em", fontWeight:500 }}>
            {isActive ? "● ACTIVE" : isDone ? "✓ DONE" : "○ STANDBY"}
          </div>
        </div>
        {isDone && <span style={{ color:"#22c55e", fontSize:11 }}>✓</span>}
      </div>

      {isActive && thought && (
        <div style={{
          marginTop:8, paddingTop:8,
          borderTop:`1px solid ${agent.border}`,
          fontSize:8.5, color: agent.color, opacity:0.75,
          fontFamily:"var(--font-mono)", lineHeight:1.6,
          overflow:"hidden", textOverflow:"ellipsis",
          display:"-webkit-box", WebkitLineClamp:2, WebkitBoxOrient:"vertical",
        }}>
          {thought}
        </div>
      )}
    </div>
  );
}

function LogTerminal({ logs, running }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current) ref.current.scrollTop = ref.current.scrollHeight;

/* ── CODE DISPLAY ───────────────────────────────────────────────────────────── */
function CodeDisplay({ file }) {
  const [copied, setCopied] = useState(false);

  if (!file) return (
    <div style={{ display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", height:"100%", gap:12 }}>
      {I("FileCode", 32, "#1e293b")}
      <span style={{ fontSize:10, color:"#1e293b" }}>Select a file to view source</span>
    </div>
  );

  const handleCopy = () => {
    copyText(file.content);
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };

  const handleDownload = () => {
    const blob = new Blob([file.content], { type:"text/plain" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = file.name;
    a.click(); URL.revokeObjectURL(url);
  };

  return (
    <div style={{ height:"100%", display:"flex", flexDirection:"column" }}>
      <div style={{
        display:"flex", alignItems:"center", gap:8, padding:"7px 14px",
        borderBottom:"1px solid rgba(255,255,255,0.04)",
        background:"rgba(0,0,0,0.3)", flexShrink:0,
      }}>
        {I("FileCode", 11, "#22d3ee")}
        <span style={{ fontSize:10, color:"#64748b", fontFamily:"var(--font-mono)", flex:1 }}>{file.name}</span>
        <span style={{ fontSize:8, color:"#1e293b" }}>{(file.content?.length/1024).toFixed(1)}kb</span>
        <button onClick={handleDownload} title="Download" style={{ background:"transparent", border:"1px solid rgba(255,255,255,0.07)", borderRadius:4, color:"#475569", cursor:"pointer", padding:"3px 7px", display:"flex", alignItems:"center", gap:3, fontSize:8, letterSpacing:"0.04em", transition:"all .15s" }}
          onMouseEnter={e=>e.currentTarget.style.color="#22d3ee"}
          onMouseLeave={e=>e.currentTarget.style.color="#475569"}>
          {I("Download", 9, "currentColor")} DL
        </button>
        <button onClick={handleCopy} style={{ background:"transparent", border:"1px solid rgba(255,255,255,0.07)", borderRadius:4, color: copied ? "#22c55e" : "#475569", cursor:"pointer", padding:"3px 7px", display:"flex", alignItems:"center", gap:3, fontSize:8, letterSpacing:"0.04em", transition:"all .15s" }}>
          {copied ? I("CheckCircle2", 9, "#22c55e") : I("Copy", 9, "currentColor")} {copied ? "Copied" : "Copy"}
        </button>
      </div>
      <div style={{ flex:1, overflowY:"auto", padding:"14px 16px" }}>

        />
      </div>
    </div>
  );
}

function PreviewCanvas({ files, isVisible }) {
  const iframeRef = useRef(null);
  const [maximized, setMaximized] = useState(false);

  useEffect(() => {
    if (!isVisible || !iframeRef.current) return;
    const htmlFile = files.find(f => f.name === "index.html");
    const cssFile  = files.find(f => f.name === "styles.css");
    const jsFile   = files.find(f => f.name === "app.js");
    if (!htmlFile) return;
    let content = htmlFile.content || "";
    if (cssFile) {
      content = content.includes("<style>")
        ? content
        : content.replace("</head>", `<style>${cssFile.content}</style></head>`);
    }
    if (jsFile) {
      content = content.replace("</body>", `<script>${jsFile.content}<\/script></body>`);
    }
    const doc = iframeRef.current.contentDocument;
    doc.open(); doc.write(content); doc.close();
  }, [files, isVisible]);

  if (!isVisible) return null;

  return (
    <div style={{
      display:"flex", flexDirection:"column", height:"100%",

/* ── MAIN APP ───────────────────────────────────────────────────────────────── */
function App() {
  const [running,   setRunning]   = useState(false);
  const [done,      setDone]      = useState(false);
  const [logs,      setLogs]      = useState([]);
  const [files,     setFiles]     = useState([]);
  const [selected,  setSelected]  = useState(null);
  const [agentStates, setAgentStates] = useState({
    architect: { status:"idle", thought:"" },
    developer: { status:"idle", thought:"" },
    debugger:  { status:"idle", thought:"" },
  });
  const [showCanvas,  setShowCanvas]  = useState(true);
  const [canvasMode,  setCanvasMode]  = useState("preview");
  const [canvasWidth, setCanvasWidth] = useState(460);
  const [notification, setNotification] = useState(null);

  // Toast notifications
  const notify = useCallback((msg, type="info") => {
    setNotification({ msg, type, id: Date.now() });
    setTimeout(() => setNotification(null), 4000);
  }, []);

  // Drag-to-resize canvas
  const dragging = useRef(false);
  const startX   = useRef(0);
  const startW   = useRef(0);
  useEffect(() => {
    const onMove = e => {
      if (!dragging.current) return;
      const delta = startX.current - e.clientX;
      setCanvasWidth(Math.min(800, Math.max(300, startW.current + delta)));
    };
    const onUp = () => { dragging.current = false; };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup",   onUp);
    return () => { window.removeEventListener("mousemove", onMove); window.removeEventListener("mouseup", onUp); };
  }, []);

  const addLog = useCallback((type, content) => {
    setLogs(l => [...l, { type, content, ts: Date.now() }]);
  }, []);

  /* SSE message handler */
  const handleSSE = useCallback((data) => {
    if (!data) return;
    const type    = data.type || "info";
    const content = data.message || data.content || JSON.stringify(data);
    addLog(type, content);

    // Agent state update
    if (data.agent) {
      setAgentStates(prev => ({
        ...prev,
        [data.agent]: {
          status: data.status || prev[data.agent]?.status || "idle",
          thought: data.thought || prev[data.agent]?.thought || "",
        },
      }));
    }

    // File received
    if (data.type === "file" && data.filename && data.content) {
      setFiles(prev => {
        const idx = prev.findIndex(f => f.name === data.filename);
        const updated = { name: data.filename, content: data.content };
        if (idx >= 0) { const n=[...prev]; n[idx]=updated; return n; }
        return [...prev, updated];
      });
      // Auto-select first HTML file
      setSelected(prev => prev ?? (data.filename.endsWith(".html") ? { name: data.filename, content: data.content } : prev));
      notify(`📄 ${data.filename} generated`, "success");
    }

    // Full result
    if (data.type === "result" && data.files) {
      const newFiles = Object.entries(data.files).map(([name,content]) => ({ name, content }));
      setFiles(newFiles);
      if (newFiles.length > 0) setSelected(newFiles[0]);
    }

    // Done
    if (data.type === "done") {
      setRunning(false);
      setDone(true);
      setAgentStates(prev => {
        const n = {...prev};
        Object.keys(n).forEach(k => { if(n[k].status==="active") n[k]={...n[k], status:"done"}; });
        return n;
      });
      addLog("success", "✓ MISSION COMPLETE — All agents finished");
      notify("✓ Build complete!", "success");
    }

    // Error
    if (data.type === "error") {
      setRunning(false);
      addLog("error", `SYSTEM ERROR: ${data.message}`);
      notify(`⚠ ${data.message}`, "error");
    }
  }, [addLog, notify]);

  /* Submit / connect to backend */
  const handleSubmit = useCallback(async ({ name, desc }) => {
    setLogs([]);
    setFiles([]);
    setSelected(null);
    setDone(false);
    setRunning(true);
    setAgentStates({ architect:{status:"idle",thought:""}, developer:{status:"idle",thought:""}, debugger:{status:"idle",thought:""} });
    setShowCanvas(true);

    addLog("system", `▶ ACTIVATING AGENTS — "${name}"`);
    addLog("system", `Backend: ${HF_URL}`);
    addLog("info",   `Startup: ${desc.substring(0,80)}...`);

    const sseUrl = `${HF_URL}/stream?startup_name=${encodeURIComponent(name)}&startup_idea=${encodeURIComponent(desc)}`;

    try {
      // Try GET SSE first
      const es = new EventSource(sseUrl);
      let gotData = false;

      es.onmessage = e => {
        gotData = true;
        try { handleSSE(JSON.parse(e.data)); } catch { handleSSE({ type:"raw", content: e.data }); }
      };

      es.onerror = async () => {
        es.close();
        if (!gotData) {
          // Fallback: POST /deploy with ReadableStream
          addLog("info", "SSE unavailable — using /deploy POST stream...");
          try {
            const res = await fetch(`${HF_URL}/deploy`, {
              method: "POST",
              headers: { "Content-Type":"application/json" },
              body: JSON.stringify({ startup_name: name, startup_idea: desc }),
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const reader  = res.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";
            while (true) {
              const { done: rd, value } = await reader.read();
              if (rd) break;
              buffer += decoder.decode(value, { stream: true });
              const lines = buffer.split("\n");
              buffer = lines.pop();
              for (const line of lines) {
                if (line.startsWith("data: ")) {
                  try { handleSSE(JSON.parse(line.slice(6))); } catch {}
                }
              }
            }
            // flush remaining
            for (const line of buffer.split("\n")) {
              if (line.startsWith("data: ")) {
                try { handleSSE(JSON.parse(line.slice(6))); } catch {}
              }
            }
          } catch (err) {
            addLog("error", `Connection failed: ${err.message}`);
            setRunning(false);
          }
        }
      };
    } catch (err) {
      addLog("error", `Failed to connect: ${err.message}`);
      setRunning(false);
    }
  }, [addLog, handleSSE]);

  /* Keep selected file content fresh */
  const selectedFile = useMemo(() => {
    if (!selected) return null;
    return files.find(f => f.name === selected.name) || selected;
  }, [selected, files]);

  /* ── RENDER ─────────────────────────────────────────────────────────────── */
  return (
    <>
      {/* ── BG LAYERS ── */}
      <div style={{ position:"fixed", inset:0, zIndex:0, pointerEvents:"none",
        background:`
          radial-gradient(ellipse 90% 60% at 15% -10%, rgba(34,211,238,0.045) 0%, transparent 55%),
          radial-gradient(ellipse 60% 40% at 85% 105%, rgba(245,158,11,0.03) 0%, transparent 50%),
          radial-gradient(ellipse 100% 100% at 50% 50%, #05070f 0%, #03040c 100%)
        `,
      }} />
      {/* Grid */}
      <div style={{
        position:"fixed", inset:0, zIndex:0, pointerEvents:"none",
        backgroundImage:`linear-gradient(rgba(34,211,238,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(34,211,238,0.02) 1px, transparent 1px)`,
        backgroundSize:"60px 60px",
        animation:"grid-pulse 6s ease-in-out infinite",
      }} />
      {/* Scanline */}
      <div style={{
        position:"fixed", left:0, right:0, height:120, zIndex:0, pointerEvents:"none",
        background:"linear-gradient(to bottom, transparent, rgba(34,211,238,0.012), transparent)",
        animation:"scanline 8s linear infinite",
      }} />

      {/* ── NOTIFICATION TOAST ── */}
      {notification && (
        <div style={{
          position:"fixed", top:12, right:16, zIndex:500,
          background: notification.type === "success" ? "rgba(34,197,94,0.12)" : notification.type === "error" ? "rgba(244,63,94,0.12)" : "rgba(34,211,238,0.1)",
          border: `1px solid ${notification.type === "success" ? "rgba(34,197,94,0.3)" : notification.type === "error" ? "rgba(244,63,94,0.3)" : "rgba(34,211,238,0.25)"}`,
          borderRadius:7, padding:"8px 14px",
          fontSize:10.5, color: notification.type === "success" ? "#22c55e" : notification.type === "error" ? "#f43f5e" : "#22d3ee",
          fontFamily:"var(--font-mono)", backdropFilter:"blur(12px)",
          animation:"status-slide-in 0.25s ease both",
          boxShadow:"0 4px 20px rgba(0,0,0,0.5)",
        }}>
          {notification.msg}
        </div>
      )}

      {/* ── APP SHELL ── */}
      <div style={{ position:"relative", zIndex:1, width:"100vw", height:"100vh", display:"flex", flexDirection:"column", overflow:"hidden" }}>

        {/* ── TOP NAV ── */}
        <nav style={{
          height:46, flexShrink:0,
          display:"flex", alignItems:"center", padding:"0 16px", gap:12,
          borderBottom:"1px solid rgba(255,255,255,0.05)",
          background:"rgba(3,4,12,0.92)", backdropFilter:"blur(16px)",
          zIndex:100,
        }}>
          {/* Logo */}
          <div style={{ display:"flex", alignItems:"center", gap:8, marginRight:8 }}>
            <div style={{
              width:26, height:26, borderRadius:6, flexShrink:0,
              background:"linear-gradient(135deg, rgba(34,211,238,0.22), rgba(34,211,238,0.05))",
              border:"1px solid rgba(34,211,238,0.35)",
              display:"flex", alignItems:"center", justifyContent:"center",
              boxShadow:"0 0 14px rgba(34,211,238,0.2)",
            }}>
              {I("Crown", 12, "#22d3ee")}
            </div>
            <span style={{ fontSize:13, fontWeight:900, color:"#f1f5f9", fontFamily:"var(--font-display)", letterSpacing:"-0.02em", whiteSpace:"nowrap" }}>
              Digital Godfather
            </span>
            <span style={{ fontSize:8, color:"#334155", border:"1px solid rgba(255,255,255,0.06)", padding:"1px 5px", borderRadius:3 }}>v3.0</span>
          </div>

          {/* Agent status pills */}
          <div style={{ display:"flex", alignItems:"center", gap:8 }}>
            {Object.values(AGENTS).map(a => (
              <div key={a.id} style={{
                display:"flex", alignItems:"center", gap:4,
                padding:"3px 8px",
                background: agentStates[a.id]?.status === "active" ? a.bg : "transparent",
                border:`1px solid ${agentStates[a.id]?.status === "active" ? a.border : "rgba(255,255,255,0.04)"}`,
                borderRadius:4, transition:"all .3s",
              }}>
                <PulseDot color={a.color} size={5} active={agentStates[a.id]?.status === "active"} />
                <span style={{ fontSize:8.5, color: agentStates[a.id]?.status === "active" ? a.color : "#334155", letterSpacing:"0.05em", whiteSpace:"nowrap" }}>
                  {a.label}
                </span>
              </div>
            ))}
          </div>

          <div style={{ flex:1 }} />

          {/* HF Status */}
          <div style={{ display:"flex", alignItems:"center", gap:5, padding:"3px 9px", border:"1px solid rgba(255,255,255,0.05)", borderRadius:4 }}>
            <PulseDot color="#22c55e" size={4} active />
            <span style={{ fontSize:8, color:"#334155", fontFamily:"var(--font-mono)", letterSpacing:"0.05em" }}>HF SPACES</span>
          </div>

          {/* Canvas toggles */}
          <div style={{ display:"flex", gap:3 }}>
            {[["preview","Eye","Preview"],["code","Code2","Code"]].map(([mode,icon,label]) => {
              const active = canvasMode===mode && showCanvas;
              return (
                <button key={mode} onClick={()=>{ setCanvasMode(mode); setShowCanvas(true); }}
                  style={{
                    display:"flex", alignItems:"center", gap:4, padding:"4px 9px", borderRadius:4,
                    background: active ? "rgba(34,211,238,0.1)" : "transparent",
                    border:`1px solid ${active ? "rgba(34,211,238,0.25)" : "rgba(255,255,255,0.05)"}`,
                    color: active ? "#22d3ee" : "#475569",
                    cursor:"pointer", fontSize:9.5, transition:"all .15s", letterSpacing:"0.04em",
                  }}>
                  {I(icon, 10, "currentColor")} {label}
                </button>
              );
            })}
            <button onClick={()=>setShowCanvas(s=>!s)}
              style={{ padding:"4px 7px", borderRadius:4, background:"transparent", border:"1px solid rgba(255,255,255,0.05)", color:"#334155", cursor:"pointer", display:"flex", alignItems:"center", transition:"all .15s" }}
              onMouseEnter={e=>e.currentTarget.style.color="#22d3ee"}
              onMouseLeave={e=>e.currentTarget.style.color="#334155"}>
              {showCanvas ? I("PanelRightClose",12,"currentColor") : I("PanelRight",12,"currentColor")}
            </button>
          </div>
        </nav>

        {/* ── MAIN LAYOUT ── */}
        <div style={{ flex:1, display:"flex", overflow:"hidden" }}>

          {/* ── LEFT SIDEBAR ── */}
          <div className="sidebar-desktop" style={{
            width:256, flexShrink:0,
            display:"flex", flexDirection:"column",
            borderRight:"1px solid rgba(255,255,255,0.04)",
            background:"rgba(4,5,14,0.75)",
            overflow:"hidden",
          }}>
            <PromptPanel onSubmit={handleSubmit} running={running} done={done} />
            {/* Agent cards injected here via absolute positioning trick */}
            <div style={{ padding:"10px 12px", borderTop:"1px solid rgba(255,255,255,0.04)", display:"flex", flexDirection:"column", gap:5, flexShrink:0, background:"rgba(0,0,0,0.25)" }}>
              <div style={{ fontSize:7.5, color:"#1e293b", letterSpacing:"0.15em", textTransform:"uppercase", marginBottom:2 }}>
                Multi-Agent Flow
              </div>
              {Object.values(AGENTS).map(a => (
                <AgentCard key={a.id} agent={a} status={agentStates[a.id]?.status} thought={agentStates[a.id]?.thought} />
              ))}
            </div>
          </div>

          {/* ── CENTER: File Bar + Terminal ── */}
          <div className="main-center" style={{ flex:1, display:"flex", flexDirection:"column", overflow:"hidden", minWidth:0 }}>
            {/* File bar (only when files exist) */}
            {files.length > 0 && (
              <div style={{
                borderBottom:"1px solid rgba(255,255,255,0.04)",
                background:"rgba(0,0,0,0.35)", flexShrink:0,
                animation:"fadeup .2s ease both",
              }}>
                <div style={{ padding:"5px 14px 0", display:"flex", alignItems:"center", gap:8, marginBottom:2 }}>
                  {I("Folder", 10, "#334155")}
                  <span style={{ fontSize:8, color:"#334155", letterSpacing:"0.15em", textTransform:"uppercase" }}>Generated Files</span>
                  <span style={{ fontSize:7.5, color:"#22d3ee", background:"rgba(34,211,238,0.1)", border:"1px solid rgba(34,211,238,0.2)", padding:"0 5px", borderRadius:3 }}>
                    {files.length}
                  </span>
                </div>
                <div style={{ display:"flex", overflowX:"auto", paddingBottom:1 }}>
                  <FileTree files={files} selected={selectedFile} onSelect={setSelected} />
                </div>
              </div>
            )}

            {/* Terminal */}
            <div style={{ flex:1, overflow:"hidden" }}>
              <LogTerminal logs={logs} running={running} />
            </div>
          </div>

          {/* ── DRAG HANDLE ── */}
          {showCanvas && (
            <div
              className="drag-handle"
              onMouseDown={e=>{ dragging.current=true; startX.current=e.clientX; startW.current=canvasWidth; e.preventDefault(); }}
              style={{ width:4, flexShrink:0, cursor:"col-resize", background:"rgba(255,255,255,0.03)", borderLeft:"1px solid rgba(255,255,255,0.04)", transition:"background .15s", zIndex:10 }}
              onMouseEnter={e=>e.currentTarget.style.background="rgba(34,211,238,0.18)"}
              onMouseLeave={e=>e.currentTarget.style.background="rgba(255,255,255,0.03)"}
            />
          )}

          {/* ── RIGHT CANVAS PANEL ── */}
          {showCanvas && (
            <div className="canvas-panel" style={{
              width: canvasWidth, flexShrink:0, overflow:"hidden",
              borderLeft:"1px solid rgba(255,255,255,0.04)",
              display:"flex", flexDirection:"column",
              background:"rgba(4,5,14,0.9)",
              transition:"width .2s ease",
            }}>
              {/* Canvas tabs */}
              <div style={{
                display:"flex", alignItems:"center",
                borderBottom:"1px solid rgba(255,255,255,0.04)",
                background:"rgba(0,0,0,0.4)", flexShrink:0,
              }}>
                {[
                  { mode:"preview", icon:"Eye",      label:"Live Preview" },
                  { mode:"code",    icon:"FileCode",  label: selectedFile?.name || "Code View" },
                ].map(({ mode, icon, label }) => (
                  <button key={mode} onClick={()=>setCanvasMode(mode)}
                    style={{
                      display:"flex", alignItems:"center", gap:5, padding:"8px 14px",
                      background: canvasMode===mode ? "rgba(34,211,238,0.04)" : "transparent",
                      borderBottom: canvasMode===mode ? "2px solid #22d3ee" : "2px solid transparent",
                      border:"none",
                      color: canvasMode===mode ? "#22d3ee" : "#334155",
                      cursor:"pointer", fontSize:9.5, transition:"all .15s", letterSpacing:"0.04em",
                    }}>
                    {I(icon,10,"currentColor")} {label}
                  </button>
                ))}
                <div style={{ flex:1 }} />
                {files.length > 0 && canvasMode === "preview" && (
                  <button
                    onClick={() => {
                      const htmlFile = files.find(f=>f.name==="index.html");
                      const cssFile  = files.find(f=>f.name==="styles.css");
                      const jsFile   = files.find(f=>f.name==="app.js");
                      if (!htmlFile) return;
                      let c = htmlFile.content;
                      if (cssFile) c = c.replace("</head>",`<style>${cssFile.content}</style></head>`);
                      if (jsFile)  c = c.replace("</body>",`<script>${jsFile.content}<\/script></body>`);
                      const blob = new Blob([c], {type:"text/html"});
                      const url = URL.createObjectURL(blob);
                      window.open(url, "_blank");
                    }}
                    style={{ margin:"0 8px", padding:"3px 9px", borderRadius:4, background:"transparent", border:"1px solid rgba(255,255,255,0.06)", color:"#475569", cursor:"pointer", fontSize:8.5, display:"flex", alignItems:"center", gap:3, transition:"all .15s" }}
                    onMouseEnter={e=>e.currentTarget.style.color="#22d3ee"}
                    onMouseLeave={e=>e.currentTarget.style.color="#475569"}>
                    {I("Maximize2",9,"currentColor")} Open
                  </button>
                )}
              </div>

              {/* Canvas content */}
              <div style={{ flex:1, overflow:"hidden" }}>
                {canvasMode === "preview"
                  ? <PreviewCanvas files={files} isVisible={true} />
                  : <CodeDisplay file={selectedFile} />
                }
              </div>
            </div>
          )}
        </div>

        {/* ── STATUS BAR ── */}
        <div style={{
          height:20, flexShrink:0,
          display:"flex", alignItems:"center", padding:"0 14px", gap:16,
          borderTop:"1px solid rgba(255,255,255,0.03)",
          background:"rgba(2,3,9,0.97)",
        }}>
          {[
            `HF: jaezyh-digital-godfather-core.hf.space`,
            `Agents: 3`,
            `Files: ${files.length}`,
            `Logs: ${logs.length}`,
            running ? "● RUNNING" : done ? "✓ COMPLETE" : "○ READY",
          ].map((item,i) => (
            <span key={i} style={{
              fontSize:8, letterSpacing:"0.07em",
              fontFamily:"var(--font-mono)",
              color: i === 4 ? (running ? "#f59e0b" : done ? "#22c55e" : "#1e293b") : "#1e293b",
              whiteSpace:"nowrap",
            }}>
              {item}
            </span>
          ))}
          <div style={{ flex:1 }} />
          <span style={{ fontSize:8, color:"#1e293b", fontFamily:"var(--font-mono)" }}>
            Digital Godfather © 2025
          </span>
        </div>
      </div>
    </>
  );
}

/* ── MOUNT ───────────────────────────────────────────────────────────────────── */
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
